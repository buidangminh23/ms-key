name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - name: Verify Windows update handoff and rollback
        shell: powershell
        run: ./scripts/test-windows-update.ps1
      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }
      - name: Package
        shell: pwsh
        run: ./scripts/package-windows.ps1 -OutDir dist
      - name: Package CLI
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          cargo build --release -p mskey-cli
          $stage = Join-Path $env:RUNNER_TEMP 'mskey-cli-win-x64'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item target/release/mskey.exe (Join-Path $stage 'mskey.exe')
          Copy-Item LICENSE (Join-Path $stage 'LICENSE.txt')
          Copy-Item THIRD-PARTY-NOTICES.md (Join-Path $stage 'THIRD-PARTY-NOTICES.txt')
          & (Join-Path $stage 'mskey.exe') --version
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "dist/mskey-cli-${version}-windows-x64.zip" -Force
      - name: Install, smoke test and uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/MSKey-Setup-*.exe | Select-Object -First 1
          $previous = Join-Path $env:RUNNER_TEMP 'MSKey-previous.exe'
          curl.exe -fsSL --connect-timeout 15 --max-time 90 --retry 2 -o $previous https://github.com/buidangminh23/ms-key/releases/download/v0.2.2/MSKey-Setup-0.2.2-windows-x64.exe
          if ($LASTEXITCODE -or (Get-FileHash $previous).Hash -ne 'e1ec3965c13a204699e4d40f8714c436510e213e2f30692241b3dce231dd0922') { throw 'Previous installer could not be verified' }
          $prior = Start-Process $previous -ArgumentList '/S' -PassThru
          if (!$prior.WaitForExit(120000) -or $prior.ExitCode -ne 0) { throw 'Previous install failed' }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\MSKey'
          if ((Get-ItemProperty $key).DisplayVersion -ne '0.2.2') { throw 'Missing previous installation' }
          $p = Start-Process $setup.FullName -ArgumentList '/S' -PassThru
          if (!$p.WaitForExit(120000)) { throw 'Upgrade timed out' }
          if ((Get-ItemProperty $key).DisplayVersion -ne $env:GITHUB_REF_NAME.TrimStart('v')) { throw 'Upgrade version mismatch' }
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          $dir = "$env:LOCALAPPDATA\Programs\MS Key"
          $smoke = Join-Path $env:RUNNER_TEMP 'smoke.txt'
          $q = Start-Process "$dir\MSKey.exe" -ArgumentList '--verify-smoke', $smoke -Wait -PassThru
          if ($q.ExitCode -ne 0) { throw "smoke exit $($q.ExitCode)" }
          Get-Content $smoke -TotalCount 1
          Start-Process "$dir\Uninstall.exe" -ArgumentList '/S' -Wait | Out-Null
          foreach ($i in 1..30) { if (-not (Test-Path $dir)) { break }; Start-Sleep 1 }
          if (Test-Path $dir) { throw "uninstall left $dir" }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\MSKey') { throw "uninstall left registry key" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cross-compile and package ARM64
        shell: pwsh
        run: |
          rustup target add aarch64-pc-windows-msvc
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          cargo build --release --target aarch64-pc-windows-msvc -p mskey-win -p mskey-cli
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $appStage = Join-Path $env:RUNNER_TEMP 'mskey-win-arm64'
          Remove-Item $appStage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $appStage -Force | Out-Null
          Copy-Item target/aarch64-pc-windows-msvc/release/mskey-win.exe (Join-Path $appStage 'MSKey.exe')
          Copy-Item LICENSE (Join-Path $appStage 'LICENSE.txt')
          Copy-Item THIRD-PARTY-NOTICES.md (Join-Path $appStage 'THIRD-PARTY-NOTICES.txt')
          Compress-Archive -Path (Join-Path $appStage '*') -DestinationPath "dist/MSKey-${version}-windows-arm64-portable.zip" -Force
          $cliStage = Join-Path $env:RUNNER_TEMP 'mskey-cli-arm64'
          Remove-Item $cliStage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $cliStage -Force | Out-Null
          Copy-Item target/aarch64-pc-windows-msvc/release/mskey.exe (Join-Path $cliStage 'mskey.exe')
          Copy-Item LICENSE (Join-Path $cliStage 'LICENSE.txt')
          Copy-Item THIRD-PARTY-NOTICES.md (Join-Path $cliStage 'THIRD-PARTY-NOTICES.txt')
          Compress-Archive -Path (Join-Path $cliStage '*') -DestinationPath "dist/mskey-cli-${version}-windows-arm64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: dist/*

  linux:
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates git pkg-config libgtk-3-dev xvfb xauth
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p mskey-core -p mskey-ffi -p mskey-cli -p mskey-linux
      - run: bash scripts/package-linux.sh dist
      - name: Package CLI
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          cargo build --release -p mskey-cli
          STAGE="$(mktemp -d)"
          trap 'rm -rf "$STAGE"' EXIT
          cp target/release/mskey "$STAGE/mskey"
          cp LICENSE "$STAGE/LICENSE"
          cp THIRD-PARTY-NOTICES.md "$STAGE/THIRD-PARTY-NOTICES.md"
          "$STAGE/mskey" --version
          tar -C "$STAGE" -czf "dist/mskey-cli-${VERSION}-linux-amd64.tar.gz" mskey LICENSE THIRD-PARTY-NOTICES.md
      - name: Install package and smoke test
        run: |
          curl -fsSL --connect-timeout 15 --max-time 90 --retry 2 -o /tmp/mskey-previous.deb https://github.com/buidangminh23/ms-key/releases/download/v0.2.2/mskey_0.2.2_amd64.deb
          echo 'c4416adfa7cdd47f00abe9dccfa7d72929984cdd0ae1724113122c47c43b489f  /tmp/mskey-previous.deb' | sha256sum --check
          DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/mskey-previous.deb
          test "$(dpkg-query -W -f='${Version}' mskey)" = "0.2.2"
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/mskey_*_amd64.deb
          test "$(dpkg-query -W -f='${Version}' mskey)" = "${GITHUB_REF_NAME#v}"
          grep -q '<exec>/usr/bin/mskey-linux --ibus</exec>' /usr/share/ibus/component/mskey.xml
          xvfb-run -a /usr/bin/mskey-linux --verify-smoke /tmp/smoke.txt
          head -n1 /tmp/smoke.txt
          apt-get remove -y mskey
          test ! -e /usr/bin/mskey-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    container: ubuntu:22.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates git pkg-config libgtk-3-dev xvfb xauth
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p mskey-core -p mskey-ffi -p mskey-cli -p mskey-linux
      - run: bash scripts/package-linux.sh dist
      - name: Package CLI
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          cargo build --release -p mskey-cli
          STAGE="$(mktemp -d)"
          trap 'rm -rf "$STAGE"' EXIT
          cp target/release/mskey "$STAGE/mskey"
          cp LICENSE "$STAGE/LICENSE"
          cp THIRD-PARTY-NOTICES.md "$STAGE/THIRD-PARTY-NOTICES.md"
          "$STAGE/mskey" --version
          tar -C "$STAGE" -czf "dist/mskey-cli-${VERSION}-linux-arm64.tar.gz" mskey LICENSE THIRD-PARTY-NOTICES.md
      - name: Install package and smoke test
        run: |
          curl -fsSL --connect-timeout 15 --max-time 90 --retry 2 -o /tmp/mskey-previous.deb https://github.com/buidangminh23/ms-key/releases/download/v0.2.2/mskey_0.2.2_arm64.deb
          echo '24f68d315735680121cd6f3f3e4aaabe4b457ee7265940e9cd483022080b893f  /tmp/mskey-previous.deb' | sha256sum --check
          DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/mskey-previous.deb
          test "$(dpkg-query -W -f='${Version}' mskey)" = "0.2.2"
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/mskey_*_arm64.deb
          test "$(dpkg-query -W -f='${Version}' mskey)" = "${GITHUB_REF_NAME#v}"
          grep -q '<exec>/usr/bin/mskey-linux --ibus</exec>' /usr/share/ibus/component/mskey.xml
          xvfb-run -a /usr/bin/mskey-linux --verify-smoke /tmp/smoke.txt
          head -n1 /tmp/smoke.txt
          apt-get remove -y mskey
          test ! -e /usr/bin/mskey-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: dist/*

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p mskey-core -p mskey-ffi -p mskey-cli
      - run: cargo build --release -p mskey-ffi
      - run: cd macos/MSKeyMac && swift test
      - run: cd macos/MSKeyInstaller && swift test
      - run: bash scripts/package-macos.sh dist
      - name: Package universal CLI
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin -p mskey-cli
          cargo build --release --target aarch64-apple-darwin -p mskey-cli
          STAGE="$(mktemp -d)"
          trap 'rm -rf "$STAGE"' EXIT
          lipo -create -output "$STAGE/mskey" \
            target/x86_64-apple-darwin/release/mskey \
            target/aarch64-apple-darwin/release/mskey
          CLI_ARCHS="$(lipo -archs "$STAGE/mskey")"
          [[ "$CLI_ARCHS" == *arm64* && "$CLI_ARCHS" == *x86_64* ]]
          "$STAGE/mskey" --version
          cp LICENSE "$STAGE/LICENSE"
          cp THIRD-PARTY-NOTICES.md "$STAGE/THIRD-PARTY-NOTICES.md"
          tar -C "$STAGE" -czf "dist/mskey-cli-${VERSION}-macos-universal.tar.gz" mskey LICENSE THIRD-PARTY-NOTICES.md
      - name: Install from DMG and smoke test
        run: |
          MOUNT="$RUNNER_TEMP/mskey-dmg"
          mkdir -p "$MOUNT" "$RUNNER_TEMP/dmg-apps"
          hdiutil attach dist/MSKey-*-macos-universal.dmg -readonly -nobrowse -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT"' EXIT
          test "$(readlink "$MOUNT/Applications")" = /Applications
          INSTALLER="$MOUNT/Install MS Key.app"
          codesign --verify --deep --strict "$INSTALLER"
          test -s "$INSTALLER/Contents/Resources/mskey-mark.png"
          SOURCE="$INSTALLER/Contents/Resources/MSKey.app"
          cmp "$MOUNT/MSKey.app/Contents/MacOS/MSKey" "$SOURCE/Contents/MacOS/MSKey"
          INSTALLER_ARCHS="$(lipo -archs "$INSTALLER/Contents/MacOS/MSKeyInstaller")"
          [[ "$INSTALLER_ARCHS" == *arm64* && "$INSTALLER_ARCHS" == *x86_64* ]]
          "$INSTALLER/Contents/MacOS/MSKeyInstaller" --verify-install "$SOURCE" "$RUNNER_TEMP/dmg-apps"
          "$INSTALLER/Contents/MacOS/MSKeyInstaller" --verify-install "$SOURCE" "$RUNNER_TEMP/dmg-apps"
          hdiutil detach "$MOUNT"
          trap - EXIT
          APP="$RUNNER_TEMP/dmg-apps/MSKey.app"
          test -s "$APP/Contents/Resources/mskey.icns"
          test -s "$APP/Contents/Resources/mskey-mark.png"
          codesign --verify --deep --strict "$APP"
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/MSKey")"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]]
          "$APP/Contents/MacOS/MSKey" --verify-smoke "$RUNNER_TEMP/dmg-smoke.txt"
          cat "$RUNNER_TEMP/dmg-smoke.txt"
      - name: Install from local release and smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/apps"
          curl -fsSL --connect-timeout 15 --max-time 90 --retry 2 -o "$RUNNER_TEMP/previous.zip" https://github.com/buidangminh23/ms-key/releases/download/v0.2.2/MSKey-0.2.2-macos-universal.zip
          echo "317db5f5cd6549531c668ea57c07579ef0977c9ca9b53efc1b4d42539dcbd9a1  $RUNNER_TEMP/previous.zip" | shasum -a 256 -c
          ditto -xk "$RUNNER_TEMP/previous.zip" "$RUNNER_TEMP/apps"
          test "$(plutil -extract CFBundleShortVersionString raw "$RUNNER_TEMP/apps/MSKey.app/Contents/Info.plist")" = "0.2.2"
          (cd dist && shasum -a 256 MSKey-*-macos-universal.zip > SHA256SUMS)
          MSKEY_BASE_URL="file://$PWD/dist" bash dist/install-macos.sh --dir "$RUNNER_TEMP/apps" --no-launch
          test "$(plutil -extract CFBundleShortVersionString raw "$RUNNER_TEMP/apps/MSKey.app/Contents/Info.plist")" = "${GITHUB_REF_NAME#v}"
          lipo -archs "$RUNNER_TEMP/apps/MSKey.app/Contents/MacOS/MSKey"
          "$RUNNER_TEMP/apps/MSKey.app/Contents/MacOS/MSKey" --verify-smoke "$RUNNER_TEMP/smoke.txt"
          cat "$RUNNER_TEMP/smoke.txt"
          rm dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  publish:
    needs: [windows, windows-arm64, linux, linux-arm64, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Check version and assets
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          test "v${VERSION}" = "${GITHUB_REF_NAME}"
          test "$(node -p "require('./package.json').version")" = "${VERSION}"
          for f in "MSKey-Setup-${VERSION}-windows-x64.exe" "MSKey-${VERSION}-windows-x64-portable.zip" "mskey-cli-${VERSION}-windows-x64.zip" \
                   "MSKey-${VERSION}-windows-arm64-portable.zip" "mskey-cli-${VERSION}-windows-arm64.zip" \
                   "mskey_${VERSION}_amd64.deb" "MSKey-${VERSION}-linux-amd64.tar.gz" "mskey-cli-${VERSION}-linux-amd64.tar.gz" \
                   "mskey_${VERSION}_arm64.deb" "MSKey-${VERSION}-linux-arm64.tar.gz" "mskey-cli-${VERSION}-linux-arm64.tar.gz" \
                   "MSKey-${VERSION}-macos-universal.zip" "MSKey-${VERSION}-macos-universal.dmg" "mskey-cli-${VERSION}-macos-universal.tar.gz" \
                   "install-macos.sh"; do
            test -s "artifacts/${f}" || { echo "missing ${f}"; exit 1; }
          done
          (cd artifacts && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          awk -v head="## [${VERSION}]" '
            index($0, head) == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --title "MS Key ${GITHUB_REF_NAME}" --notes-file notes.md --latest

  npm:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm test
      - name: Check whether this version is already on npm
        id: published
        run: |
          pkg="$(node -p "require('./package.json').name")"
          ver="$(node -p "require('./package.json').version")"
          if npm view "$pkg@$ver" version > /dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$pkg@$ver is already on npm"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm publish --access public
        if: steps.published.outputs.already == 'false'
