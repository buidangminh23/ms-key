[workspace]
resolver = "3"
members = [
    "crates/mskey-core",
    "crates/mskey-ffi",
    "crates/mskey-cli",
    "crates/mskey-win",
    "crates/mskey-linux",
]

[workspace.package]
version = "0.2.10"
edition = "2024"
license = "MIT"
authors = ["Bui Dang Minh"]
rust-version = "1.90"

[workspace.dependencies]
mskey-core = { path = "crates/mskey-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
panic = "abort"
